<!DOCTYPE html>
<html>

<head>
  <title>Ledig API Signature Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 500px;
    }

    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }

    button {
      background: #007bff;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
    }

    .result {
      background: #f4f4f4;
      padding: 10px;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <h2>Ledig API Signature Generator</h2>
  <input type="text" id="key" placeholder="Your API Key">
  <input type="text" id="secret" placeholder="Your Secret Key">
  <input type="text" id="path" placeholder="Path (e.g., /v1/rates)">
  <input type="text" id="body" placeholder="Request Body (e.g., {})">
  <select id="method">
    <option value="GET">GET</option>
    <option value="POST">POST</option>
  </select>
  <button onclick="generate()">Generate Credentials</button>

  <div class="result" id="output" style="display:none;">
    <p><strong>Timestamp:</strong> <span id="ts-out"></span></p>
    <p><strong>Signature:</strong> <span id="sig-out"></span></p>
    <button onclick="copyToClipboard()" style="background: #28a745;">Copy Signature</button>
  </div>



  <script>
    function copyToClipboard() {
      const sig = document.getElementByID('sig-out').innerText;
      navigator.clipboard.writeText(sig).then(() => {
        alert('Signature copied to clipboard!');
      });
    }
    function generate() {
      const secret = document.getElementById('secret').value;
      const path = document.getElementById('path').value;
      const method = document.getElementById('method').value;

      // CRITICAL: Remove all whitespace from the body to ensure it matches 
      // what the proxy server sends to your backend
      const rawBody = document.getElementById('body').value;
      const body = rawBody.replace(/\s+/g, '');

      const timestamp = Math.floor(Date.now() / 1000).toString();
      const payload = `${timestamp}.${method}.${path}.${body}`;

      const hash = CryptoJS.HmacSHA256(payload, secret);
      const signature = "v1=" + CryptoJS.enc.Base64.stringify(hash);

      document.getElementById('ts-out').innerText = timestamp;
      document.getElementById('sig-out').innerText = signature;
      document.getElementById('output').style.display = 'block';
    }
  </script>
</body>

</html>
